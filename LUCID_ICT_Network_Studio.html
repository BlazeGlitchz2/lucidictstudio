{id:'foundations',title:'What is a network?',pages:'76',time:5,tag:'Start here',subtitle:'Before NICs, IPs, and routers, understand the big idea.',simple:'A <strong>computer network</strong> is two or more devices connected so they can communicate or share things.',analogy:'Think of students in a classroom. Alone, each student has their own notes. Connected through a network, students can share notes and use the same classroom printer.',steps:['A computer, phone or printer becomes connected to other devices.','Devices can send information to one another.','Devices can share resources such as a printer or software.','Lots of connected networks together include the internet.'],terms:[['Network','Connected devices that can communicate and share resources.'],['Resource','Something shared, such as a printer or software.'],['LAN','A local area network, usually in a building or nearby area.']],points:['The internet is an enormous network of networks.','A school can share one printer between many computers.','Devices need network hardware to communicate.'],trap:'The internet is not the same thing as every network. A school LAN can exist without internet access.',examQ:'State two reasons why a school might create a network.',examA:'To share hardware (such as a printer) and to make communication between computers easier.',check:['Which is the best meaning of a network?',['One computer with many apps','Two or more connected devices','A website on the internet'],1,'A network connects devices so they can communicate or share resources.'],demo:'basics'},
{id:'nic',title:'NICs and wireless NICs',pages:'76',time:6,tag:'Hardware',subtitle:'How does a computer actually join a network?',simple:'A <strong>network interface card (NIC)</strong> is hardware that lets a device connect to a network.',analogy:'Imagine your computer speaks a language made of 0s and 1s. Its NIC is the adapter that makes this data able to travel over a connection.',steps:['The computer has binary data (0s and 1s).','The NIC converts the data into signals suitable for network communication.','The signals are carried across the network.','A wireless NIC (WNIC) uses an antenna and radio/microwave signals rather than a wired connection.'],terms:[['NIC','Network interface card: hardware used to connect a device to a network.'],['WNIC','Wireless network interface card: connects using wireless signals and an antenna.'],['Motherboard','Main circuit board of the computer; modern NICs are often built into it.']],points:['Most modern NICs are integrated into the motherboard.','Every NIC has a MAC address.','A wireless NIC can be internal or connected through USB.'],trap:'NIC does not mean an internet connection. A NIC enables network access; the network itself might be offline.',examQ:'Explain one difference between an NIC and a wireless NIC.',examA:'Both connect a device to a network, but a wireless NIC uses an antenna and wireless signals rather than a cable.',check:['Which component enables a device to join a network?',['NIC','Monitor','Speaker'],0,'The NIC is the hardware network connection component.'],demo:'nic'},
{id:'addresses',title:'MAC vs IP addresses',pages:'77',time:9,tag:'Big exam topic',subtitle:'Two addresses. Two different jobs. Learn this once and never mix them up.',simple:'A <strong>MAC address</strong> identifies a network interface. An <strong>IP address</strong> identifies where a device can be reached on a network.',analogy:'MAC is like the serial number on your school laptop; IP is like the classroom number where a message should be delivered. Change classrooms: new location, same laptop.',steps:['The NIC comes with a unique MAC address, usually 48 bits long.','An IP address is assigned when connecting to a network.','Your IP can change when you switch from home Wi-Fi to a café network.','Switches use MAC addresses; routers use IP addresses.'],terms:[['MAC address','A 48-bit hardware identifier associated with a NIC; written as six pairs of hexadecimal digits.'],['IP address','Internet Protocol address identifying a device’s network location.'],['IPv4','32-bit IP address, often displayed as four decimal groups, e.g. 254.25.28.77.'],['IPv6','128-bit IP address, written in colon-separated hexadecimal groups.'],['Protocol','An agreed set of communication rules.']],points:['MAC: hardware address; associated with the NIC. Replacing the NIC changes it.','IP: network address; can change when you connect elsewhere.','IPv4 = 32 bits; IPv6 = 128 bits.','Hexadecimal digits use 0–9 and A–F.'],trap:'Avoid saying a MAC address can never change under any circumstances: the textbook notes it changes when the NIC is replaced.',examQ:'Describe two differences between a MAC address and an IP address.',examA:'A MAC address is a 48-bit identifier associated with a NIC, while an IP address identifies a device’s location on a network. The MAC stays with its NIC; the IP may change with network location.',check:['You take the same laptop from home to a café. Which address will normally change?',['MAC address','IP address','Both must change'],1,'Your IP address can change when you join a different network.'],demo:'addresses'},
{id:'packets',title:'How data packets work',pages:'78',time:8,tag:'Visual lab',subtitle:'Understand how one big message travels as smaller pieces.',simple:'A <strong>data packet</strong> is a small piece of a larger message sent across a network.',analogy:'You want to ship a big Lego build. Instead of one huge box, you send numbered small boxes. The receiver checks all boxes arrived and rebuilds the original.',steps:['The message is split into packets.','Each packet has a header containing routing and ordering information.','Packets travel through routers; different packets may take different paths.','At the destination, sequence numbers help rebuild the correct original message.'],terms:[['Packet header','Information such as sender IP, destination IP, sequence number, packet size and packet count.'],['Sequence number','A number allowing packets to be put back in their correct order.'],['Routing table','A router’s table used to decide where a packet should travel next.']],points:['Header includes sender and receiver IP addresses.','Header includes packet sequence/identity number.','Header includes packet size and total packet count.','Routers examine destination IP addresses.'],trap:'A packet is NOT necessarily the complete message. A message can be split into many packets.',examQ:'Give three pieces of information found in a packet header.',examA:'Sender IP address; destination IP address; sequence number (other valid examples: packet size, total number of packets).',check:['Why does each packet need a sequence number?',['To change its MAC address','To reassemble packets in the right order','To make Wi-Fi faster'],1,'Sequence numbers allow the receiver to rebuild the original message in order.'],demo:'packets'},
{id:'hubs-switches',title:'Hubs and switches',pages:'78–80',time:10,tag:'Visual lab',subtitle:'Broadcast to everyone, or deliver to one computer?',simple:'A <strong>hub</strong> sends incoming data to every connected device. A <strong>switch</strong> sends data to the intended device using MAC addresses.',analogy:'Hub = teacher shouting a private message to the whole class. Switch = teacher handing the note directly to the right person.',steps:['Several computers are connected to a hub or switch.','With a hub, an incoming packet is broadcast to all connected devices.','With a switch, a MAC address lookup table identifies the destination port.','Only the intended device receives the packet, reducing traffic.'],terms:[['Hub','LAN device broadcasting incoming packets to all connected devices.'],['Switch','LAN device that forwards packets to the correct port using MAC addresses.'],['Look-up table','A table linking a switch port to a device’s MAC address.'],['Bandwidth','The amount of data a connection can carry in a given time.']],points:['Hub: less secure because all devices receive the packet.','Hub: unnecessary network traffic wastes bandwidth.','Switch: more secure and more efficient in the textbook comparison.','Neither a hub nor a switch alone connects a LAN to an outside network.'],trap:'A switch works with MAC addresses. A router uses IP addresses to move data between networks.',examQ:'Explain why a switch is preferred to a hub in a school LAN.',examA:'A switch forwards packets only to the intended device using the MAC address table, so it reduces unnecessary traffic and limits exposure of packets to other devices.',check:['Which device sends the packet only to the correct destination port?',['Hub','Switch','Monitor'],1,'A switch checks MAC addresses and forwards to the correct port.'],demo:'hubs'},
{id:'bridges-routers',title:'Bridges and routers',pages:'80–82',time:11,tag:'Big exam topic',subtitle:'One joins LAN sections. The other connects different networks.',simple:'A <strong>bridge</strong> connects LAN segments using the same protocol. A <strong>router</strong> directs packets between networks using IP addresses.',analogy:'A bridge connects two school corridors. A router is the city road junction that chooses which route will take a delivery to another neighborhood.',steps:['A local computer sends data intended for another network.','The local switch forwards the data towards a router.','The router checks the destination IP against its routing table.','The packet passes through routers and reaches the destination network.','The destination switch sends it to the final computer using its MAC address table.'],terms:[['Bridge','Connects two LANs or LAN segments that use the same communication protocol.'],['Router','Connects networks and routes packets based on destination IP address.'],['Routing table','Router information used to choose where packets should go next.']],points:['Bridge uses MAC addresses; router uses IP addresses.','Bridge joins LAN sections; router sends data between networks.','Routing tables are stored in the router’s RAM, according to the textbook.','Many home broadband routers combine router and switch functions.'],trap:'The textbook describes bridges as two-port devices; modern hardware varies, but use the book’s distinction for this exam.',examQ:'Compare a bridge and a router.',examA:'Both handle data packets. A bridge connects LANs using the same protocol and inspects MAC addresses, whereas a router connects networks and directs packets using IP addresses and a routing table.',check:['A school LAN wants to reach the internet. Which device is needed?',['Hub','Bridge','Router'],2,'A router connects a local network to external networks.'],demo:'router'},
{id:'wireless-tech',title:'Wi-Fi and Bluetooth',pages:'82–83',time:9,tag:'Comparison',subtitle:'Two wireless technologies, but for different jobs.',simple:'<strong>Wi-Fi</strong> is suited to full networks and internet access; <strong>Bluetooth</strong> is suited to nearby devices that exchange smaller amounts of data.',analogy:'Bluetooth is like speaking to the person next to you. Wi-Fi is like a classroom-wide communication system that connects many people.',steps:['Both technologies send data using electromagnetic radio waves.','Bluetooth operates around 2.4 GHz and uses frequency hopping to avoid interference.','Wi-Fi commonly uses 2.4 GHz and 5 GHz frequency bands.','Wi-Fi generally offers greater range and speed; Bluetooth is useful for low-bandwidth nearby devices.'],terms:[['Bluetooth','Wireless technology for communication over a short distance, typically between nearby devices.'],['Wi-Fi','Wireless technology often used to create WLANs and provide internet access.'],['Frequency hopping','Rapidly changing Bluetooth channels to reduce interference.'],['Access point (AP)','Device enabling wireless devices to access a local network.']],points:['Book figures: Bluetooth up to about 30 m; Wi-Fi up to about 100 m under favorable conditions.','Bluetooth: 79 channels in the book description.','Wi-Fi: better suited to larger networks; Bluetooth: headset, wearable, short-range links.','At 5 GHz, Wi-Fi can be faster but the signal typically has less range than 2.4 GHz.'],trap:'Do not assume the textbook’s speed and range numbers apply to every modern device. Learn them as book comparison figures, not universal limits.',examQ:'Give two reasons Wi-Fi is more suitable than Bluetooth for a school network.',examA:'Wi-Fi generally supports longer-range communication and higher data transfer rates, making it better suited to connecting many school devices.',check:['Which is the better fit for wireless earbuds paired to your phone?',['Bluetooth','A wired bridge','A hub'],0,'Bluetooth is suitable for short-range, low-bandwidth devices such as headsets.'],demo:'wireless'},
{id:'cloud',title:'Cloud storage explained',pages:'83–84',time:10,tag:'Real-life examples',subtitle:'Where do files go when you save them “in the cloud”?',simple:'<strong>Cloud storage</strong> means storing files on remote servers that you can access over a network, usually the internet.',analogy:'Local storage is a notebook you carry. Cloud storage is a secure locker elsewhere: you can open it from different places if you have access.',steps:['You save a file to a cloud storage service over the internet.','Remote servers store it; a provider maintains the physical systems.','Multiple copies may be kept so data can survive one server’s failure: data redundancy.','You sign in on another device and download or sync the same file.'],terms:[['Cloud storage','Saving files on remote servers rather than only on the local device.'],['Data redundancy','Keeping duplicate data across servers for resilience and availability.'],['Public cloud','Customer and cloud provider are separate organizations.'],['Private cloud','Dedicated cloud environment controlled by the organization, typically behind its firewall.'],['Hybrid cloud','A mixture of private and public cloud approaches.'],['Sync','Keeping file versions updated across devices.']],points:['Advantages: remote access, backup, synchronization, collaboration, scalable storage.','Disadvantages: internet dependence, costs, security/privacy concerns, provider failure risk.','Public/private/hybrid describe who operates or shares the storage arrangement.','Data redundancy can help protect against individual server failures, but is not a guarantee against all loss.'],trap:'Cloud is not literally in the sky; your data lives on physical servers in data centres.',examQ:'Explain two advantages and one disadvantage of cloud storage.',examA:'Advantages: files can be accessed from different devices over the internet, and remote backup helps recover lost local data. Disadvantage: poor internet can prevent access to files.',check:['Keeping the same file on several servers is called…',['Bandwidth','Data redundancy','Frequency hopping'],1,'Data redundancy means storing extra copies for resilience.'],demo:'cloud'},
{id:'lan',title:'LAN: local networks',pages:'85',time:7,tag:'Types of network',subtitle:'The type of network you might find in a school.',simple:'A <strong>local area network (LAN)</strong> connects devices across a small geographical area, such as a room or building.',analogy:'Your school’s ICT classroom, connected printers and computers can all be part of one LAN.',steps:['Devices are located near each other.','Network cables or access points connect them via switches.','People can share printers, files and software.','An administrator can manage passwords and network access.'],terms:[['LAN','Local area network, usually confined to a building or nearby buildings.'],['Network administrator','Person managing and monitoring network use and security.'],['Shared resource','A device or software service used by multiple network users.']],points:['LAN advantages: share hardware/software, easier communication, centralized management.','LAN disadvantages: malware can spread, shared-printer queues, security risks, server failures.','A LAN can connect to an external network through a router.'],trap:'A LAN does not have to connect to the internet to count as a LAN.',examQ:'State two advantages and two disadvantages of a LAN.',examA:'Advantages: resources such as printers can be shared; users can communicate easily. Disadvantages: viruses can spread across the network; a failed central server may disrupt services.',check:['Which is the clearest example of a LAN?',['Two offices in different countries','Computers in one school building','The entire internet'],1,'A LAN covers a limited local area, such as a school building.'],demo:'lan'},
{id:'wlan',title:'WLAN: wireless LANs',pages:'85–86',time:9,tag:'Visual lab',subtitle:'How does a school cover many rooms with Wi-Fi?',simple:'A <strong>wireless local area network (WLAN)</strong> is a LAN where devices communicate without a network cable to each device.',analogy:'Think of Wi-Fi access points as multiple speakers around a school. Each covers its nearby area so phones and laptops can stay connected while moving.',steps:['A wireless access point connects to the existing wired network.','Phones or laptops use built-in wireless adapters to connect to the AP.','Multiple APs can be used across a big school to improve coverage.','Wireless gives mobility, but walls and interference can weaken the signal.'],terms:[['WLAN','Wireless local area network using radio communication.'],['Access point','Connects wireless devices to a wired LAN.'],['Interference','Another signal or barrier that disrupts wireless communication.'],['Encryption','Scrambling data so unauthorized listeners cannot read it.']],points:['Wireless benefits: mobility, flexible layout, easier expansion, fewer cables.','Wired benefits: stable signal, generally faster transfer, less radio interference.','Wireless drawbacks: weaker security without protection, interference, dead spots, walls blocking signals.','Wired drawbacks: device movement restricted; cables can create hazards.'],trap:'WLAN is a type of LAN. “Wireless” does not necessarily mean “wide area”.',examQ:'Explain two advantages and two disadvantages of a WLAN compared with a wired LAN.',examA:'Advantages: users can move within AP coverage; network expansion needs less cabling. Disadvantages: wireless suffers interference or dead spots; signals may be intercepted unless encrypted.',check:['A school wants students to use laptops while moving between rooms. Which helps most?',['WLAN with access points','Hub only','A local printer'],0,'A WLAN lets devices move within the coverage of access points.'],demo:'wlan'},
{id:'wan',title:'WAN: long-distance networks',pages:'87',time:7,tag:'Types of network',subtitle:'What if the computers are in different cities or countries?',simple:'A <strong>wide area network (WAN)</strong> connects computers or separate networks over large geographical distances.',analogy:'A school LAN is one building. A WAN is what connects that school with another campus in a different city.',steps:['There are local networks far apart geographically.','Routers and communication links connect the distant networks.','Packets pass through intermediate systems.','Data reaches a distant end system such as another bank branch or ATM.'],terms:[['WAN','Wide area network extending over long geographic distances.'],['End system','Device or system at a source or destination on a network.'],['Intermediate system','Network equipment through which data can travel between end systems.']],points:['WANs can connect LANs in different cities or countries.','A bank’s ATM network is a common example from the book.','WANs can use public communication networks or dedicated/leased lines.','The textbook gives WAN ranges from about 100 km to 1000+ km as a guide, not a strict universal boundary.'],trap:'MAN appears only as an outside-syllabus comparison in the book. It is deliberately not taught here.',examQ:'Describe one difference between a LAN and a WAN and give an example of each.',examA:'A LAN covers a limited local area, such as computers in one school. A WAN connects computers/networks over long distances, such as ATMs across a country.',check:['Which network is most suitable for connecting bank ATMs across several cities?',['LAN','WAN','Bluetooth connection'],1,'A WAN covers a large geographical distance.'],demo:'wan'}

function computer(x,y,name,target=false){return `<rect x="${x-21}" y="${y-21}" width="42" height="33" rx="7" class="${target?'svg-target':'svg-device'}"/><path d="M${x-12} ${y+15}h24" stroke="#639c8d" stroke-width="4" stroke-linecap="round"/><text x="${x}" y="${y+40}" class="svg-label">${name}</text>`}
function diagram(type){if(type==='basics')return demoWrap('SHARING RESOURCES',`<svg viewBox="0 0 520 225" class="network-svg" aria-label="A school network with connected computers and a shared printer"><path d="M120 60L255 110L402 60 M255 110L255 183" class="svg-line"/><rect x="215" y="81" width="80" height="56" rx="15" fill="#cbeade" stroke="#7eaf9d" stroke-width="2"/><text x="255" y="111" class="svg-label">Switch</text>${computer(120,59,'Student A')}${computer(402,59,'Student B')}<rect x="232" y="171" width="46" height="30" rx="5" fill="#fff" stroke="#81af9f" stroke-width="2"/><text x="255" y="221" class="svg-label">Printer</text></svg><p style="font-size:.8rem;margin:0">Both students can use the same printer because they are connected to the same network.</p>`);
if(type==='nic')return demoWrap('FROM BINARY TO NETWORK SIGNAL',`<div class="mini-data" style="align-items:center;justify-content:space-between;gap:13px;text-align:center"><div class="address-box">1 0 1 1 0</div><span style="font-size:25px;color:#639f85">→</span><div style="background:#d2ede2;border:2px solid #9dc6b0;border-radius:18px;padding:16px;font-weight:850;color:#276759">NIC</div><span style="font-size:25px;color:#639f85">→</span><svg width="122" height="58" viewBox="0 0 122 58" role="img" aria-label="Signal wave"><path d="M0 29 Q10 0 20 29 T40 29 T60 29 T80 29 T100 29 T120 29" fill="none" stroke="#4ca992" stroke-width="4"/></svg></div><p style="font-size:.8rem;margin-top:17px">The NIC converts digital data to signals suitable for its network connection. A <b>wireless NIC</b> communicates using an antenna and wireless signals.</p>`);
if(type==='addresses')return demoWrap('PHYSICAL ID VS NETWORK LOCATION',`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div style="background:#fff;border:1px solid #d6e7dd;padding:17px;border-radius:14px"><span class="chip green">MAC</span><h3 style="margin:12px 0 9px">Hardware ID</h3><div class="address-box" style="font-size:.72rem">00-1C-B3-4F-25-FF</div><p style="font-size:.75rem;color:#658174;margin-top:12px">Stays with this NIC. 48 bits.</p></div><div style="background:#fff;border:1px solid #e9dabb;padding:17px;border-radius:14px"><span class="chip pink">IP</span><h3 style="margin:12px 0 9px">Network location</h3><div class="address-box" id="ip-demo" style="font-size:.82rem;background:#fff5e6">192.168.1.8</div><p style="font-size:.75rem;color:#658174;margin-top:12px" id="ip-desc">At home · can change when you move.</p></div></div>`,`<button class="btn small" data-demo="changeIP">☷ Move laptop to café</button>`);
if(type==='packets'){let step=state.packetStep;let ar=step===0?['NETWORK','PACKETS','WORK']:step===1?['3: WORK','1: NETWORK','2: PACKETS']:['1: NETWORK','2: PACKETS','3: WORK'];return demoWrap('PACKET REASSEMBLY',`<div style="text-align:center;margin-bottom:20px"><span class="chip">Original message</span><div style="font-family:Georgia,serif;font-size:1.55rem;color:#20544c;letter-spacing:.035em;margin:8px 0">NETWORK PACKETS WORK</div></div><div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap">${ar.map((x,i)=>`<span class="packet-cell ${step===1?'reorder':''} ${step===2?'active':''}" style="font-size:.75rem">${x}</span>`).join('')}</div><p style="font-size:.8rem;text-align:center;margin:18px 0 0">${['Step 1: The message is split into numbered packets.','Step 2: Packets can arrive out of order!','Step 3: The receiver uses sequence numbers to rebuild the message.'][step]}</p>`,`<button class="btn primary small" data-demo="packets">${['Send the packets →','Put them in order →','Reset ↺'][step]}</button>`)}
if(type==='hubs'){let isHub=state.demoMode!=='switch';return demoWrap('DELIVER A PACKET',`<svg viewBox="0 0 520 270" class="network-svg" aria-label="A hub broadcasts to all computers; a switch sends to a destination"><path d="M256 130L105 50 M256 130L405 50 M256 130L105 213 M256 130L405 213" class="svg-dash"/><path d="M256 130L105 50 M256 130${isHub?'L405 50 M256 130L105 213 M256 130':''}L405 213" stroke="${isHub?'#e0ad75':'#43a990'}" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85"/>${computer(105,50,'Computer A')}${computer(405,50,'Computer B')}${computer(105,213,'Computer C')}${computer(405,213,'Computer D',true)}<rect x="208" y="99" width="96" height="62" rx="16" fill="#daf0e6" stroke="#78b3a5" stroke-width="2"/><text x="256" y="134" class="svg-label">${isHub?'HUB':'SWITCH'}</text><text x="256" y="192" class="svg-label" style="fill:#a46e3c">Target: D</text></svg><p style="font-size:.81rem;text-align:center;margin:0">${isHub?'The hub broadcasts to A, B, C and D, even though D is the target.':'The switch uses its MAC look-up table and sends the packet only to D.'}</p>`,`<button class="btn small ${isHub?'selected':''}" data-demo="hub">Hub: everyone gets it</button><button class="btn small ${!isHub?'selected':''}" data-demo="switch">Switch: only D gets it</button>`)}
if(type==='router'){let nodes=['C1','Switch 1','Router 1','Internet router','Router 4','Switch 4','C10'];let i=state.routerStep;return demoWrap('TRACE A MESSAGE FROM C1 TO C10',`<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:20px 0">${nodes.map((v,n)=>`<span class="packet-cell ${n===i?'active':''}" style="font-size:.69rem;padding:10px;${n===i?'box-shadow:0 0 0 3px #a6e4c0':''}">${v}</span>${n<nodes.length-1?'<span style="color:#649f87">→</span>':''}`).join('')}</div><p style="font-size:.8rem;margin:10px 0 0;text-align:center">${['C1 prepares data for a computer on another LAN.','The local switch passes the data towards its router.','Router 1 uses the destination IP address and routing table.','Packets cross intermediate routers between networks.','Router 4 recognizes the destination LAN.','Switch 4 looks up the destination MAC address.','C10 receives the data packet.'][i]}</p>`,`<button class="btn primary small" data-demo="nextRouter">${i===6?'Replay ↺':'Follow packet →'}</button>`)}
if(type==='wireless'){let w=state.wirelessMode==='wifi';return demoWrap('PICK THE RIGHT WIRELESS LINK',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="panel" style="padding:18px;background:${w?'#dff3e8':'#fff'};text-align:center"><div style="font-size:2rem">${w?'◉':'◌'}</div><b>Wi-Fi</b><p style="font-size:.78rem;margin:5px 0 0">Network access • Often longer range • More devices</p></div><div class="panel" style="padding:18px;background:${w?'#fff':'#e4e6f8'};text-align:center"><div style="font-size:2rem">⌁</div><b>Bluetooth</b><p style="font-size:.78rem;margin:5px 0 0">Nearby accessories • Short range • Frequency hopping</p></div></div><p style="text-align:center;margin-top:15px;font-size:.82rem">${w?'Example: students connecting laptops to school Wi-Fi.':'Example: headphones paired with a smartphone.'}</p>`,`<button class="btn small ${w?'selected':''}" data-demo="wifi">Try Wi-Fi</button><button class="btn small ${!w?'selected':''}" data-demo="bluetooth">Try Bluetooth</button>`)}
if(type==='cloud')return demoWrap('WHY EXTRA COPIES MATTER',`<div style="text-align:center"><span class="chip">Your file: homework.docx</span><div style="font-size:25px;margin:7px;color:#4eae8b">↓ Upload</div><div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">${[1,2,3].map(n=>`<div style="flex:1;min-width:95px;max-width:145px;padding:15px 10px;border:1px solid ${n===2&&state.cloudFail?'#e6a8a1':'#bbdacb'};background:${n===2&&state.cloudFail?'#fff0ed':'#fff'};border-radius:14px"><div style="font-size:2rem">${n===2&&state.cloudFail?'✕':'▤'}</div><b style="font-size:.77rem">Server ${n}</b><div style="font-size:.69rem;color:${n===2&&state.cloudFail?'#b26a59':'#56907b'}">${n===2&&state.cloudFail?'Offline':'File copied'}</div></div>`).join('')}</div><p style="margin:15px 0 2px;font-size:.82rem">${state.cloudFail?'Server 2 is offline, but the other copies can keep the file available.':'The same data is held in multiple places. This is data redundancy.'}</p></div>`,`<button class="btn small primary" data-demo="cloud">${state.cloudFail?'Restore server ↺':'Simulate a server failure'}</button>`);
if(type==='lan'||type==='wlan'||type==='wan'){let isWAN=type==='wan',isWLAN=type==='wlan';return demoWrap(isWAN?'TWO CITIES, ONE WAN':isWLAN?'ACCESS POINT COVERAGE':'A SCHOOL LAN',`<svg viewBox="0 0 520 220" class="network-svg" aria-label="${type} network diagram">${isWAN?`<rect x="15" y="42" width="190" height="137" rx="19" fill="#e5f3e9" stroke="#a5c5b5"/><rect x="315" y="42" width="190" height="137" rx="19" fill="#e5f3e9" stroke="#a5c5b5"/><path d="M205 109Q260 15 315 109" class="svg-dash"/><path d="M205 109Q260 200 315 109" class="svg-dash"/><text x="260" y="40" class="svg-label">WAN LINK</text><text x="110" y="67" class="svg-label">City A / LAN</text><text x="410" y="67" class="svg-label">City B / LAN</text><rect x="81" y="98" width="58" height="37" rx="12" fill="#b3e0d1"/><rect x="380" y="98" width="58" height="37" rx="12" fill="#b3e0d1"/><text x="110" y="121" class="svg-label">Router</text><text x="409" y="121" class="svg-label">Router</text><text x="110" y="161" class="svg-label">School / bank</text><text x="410" y="161" class="svg-label">Other branch</text>`:isWLAN?`<rect x="25" y="20" width="470" height="170" rx="22" fill="#e5f3e9" stroke="#adcebc"/><circle cx="160" cy="105" r="76" fill="#a7d3bd" opacity=".20" stroke="#77ae94" stroke-dasharray="6 5"/><circle cx="363" cy="105" r="76" fill="#a7d3bd" opacity=".20" stroke="#77ae94" stroke-dasharray="6 5"/><rect x="126" y="91" width="68" height="30" rx="10" fill="#fff" stroke="#7ca78b"/><rect x="329" y="91" width="68" height="30" rx="10" fill="#fff" stroke="#7ca78b"/><text x="160" y="110" class="svg-label">AP 1</text><text x="363" y="110" class="svg-label">AP 2</text><path d="M194 106L329 106" class="svg-line"/><text x="259" y="96" class="svg-label">Wired network</text><text x="160" y="57" class="svg-label">Room A</text><text x="363" y="57" class="svg-label">Room B</text>`:`<rect x="25" y="20" width="470" height="178" rx="22" fill="#e5f3e9" stroke="#adcebc"/><path d="M260 112L116 56 M260 112L400 56 M260 112L116 176 M260 112L400 176" class="svg-line"/><rect x="217" y="86" width="86" height="49" rx="14" fill="#fff" stroke="#8cbaaa"/><text x="260" y="115" class="svg-label">Switch</text>${computer(116,56,'PC 1')}${computer(400,56,'PC 2')}${computer(116,176,'PC 3')}${computer(400,176,'Printer')}`}</svg><p style="font-size:.81rem;text-align:center;margin:6px 0 0">${isWAN?'Routers link separate LANs over large distances.':isWLAN?'Access points extend wireless access across several rooms.':'Computers share resources within a small local area.'}</p>`)}return ''}

<aside class="side-info"><div class="panel side-card"><div class="page-circle">${idx+1}</div><h4 style="margin-top:11px">Lesson checklist</h4><ul><li>Read the simple definition</li><li>Try the visual example</li><li>Learn the keywords</li><li>Answer the quick check</li></ul></div><div class="panel side-card"><h4>Where is this in my book?</h4><p>Hodder Cambridge IGCSE ICT Third Edition<br><b>Printed page${l.pages.includes('–')?'s':''} ${l.pages}</b></p><p style="margin-top:12px">Your study range ends at printed page 87.</p></div><div class="panel side-card"><h4>Next step</h4><p>Learn the meaning, then compare examples. You don't need to memorise every paragraph.</p><button class="btn small" data-action="practiceLesson">Practice this topic ↗</button></div></aside></div>`}
function getQuestion(q,id,compact=false){return `<div class="question-card panel" id="${id}"><div class="eyebrow">${compact?'QUESTION':'EXAM PRACTICE'} · ${escapeHTML(lessons.find(l=>l.id===q[0])?.title||'Networks')}</div><h3 style="margin-top:8px">${escapeHTML(q[1])}</h3><div class="answer-stack">${q[2].map((a,i)=>`<button class="answer-opt" data-answer="${id}|${i}">${String.fromCharCode(65+i)}. ${escapeHTML(a)}</button>`).join('')}</div><div class="feedback" data-feedback="${id}" aria-live="polite"></div></div>`}
function practiceHome(){return `<div class="eyebrow">PRACTICE ZONE</div><h1 style="font-family:Georgia,serif;margin:10px 0">Questions that make it stick.</h1><p class="muted" style="max-width:650px;margin-bottom:24px">${questions.length} original exam-style multiple-choice questions, grouped by the exact pages you're studying. Each answer explains why it is right.</p><div class="panel" style="padding:25px;margin-bottom:16px"><span class="chip green">RECOMMENDED</span><h2 style="margin:12px 0">Quick 20-question mix</h2><p style="font-size:.86rem;color:#60776d">Questions from every lesson, instant correction, a final score, and another attempt whenever you're ready.</p><button class="btn primary" data-action="startQuiz" data-topic="all">Start 20 questions →</button></div><div class="section-head"><div><div class="eyebrow">FOCUS ON ONE THING</div><h2>Practice by topic.</h2></div></div><div class="lesson-grid">${lessons.map((l,i)=>`<article class="panel lesson-tile" style="min-height:200px" data-topic-tile="${l.id}" role="button" tabindex="0"><div class="tile-top"><span class="tile-num">${String(i+1).padStart(2,'0')}</span><span class="chip">${questions.filter(q=>q[0]===l.id).length} questions</span></div><h3>${l.title}</h3><div class="tile-bottom">Start this topic <b>↗</b></div></article>`).join('')}</div>`}
function startQuiz(topic){let pool=questions.map((q,i)=>({q,i})).filter(o=>topic==='all'||o.q[0]===topic);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state.quizIds=pool.slice(0,topic==='all'?20:pool.length).map(x=>x.i);state.practiceIndex=0;state.quizAnswered={};state.quizMode='practice';go('quiz')}
function quizPage(){let ids=state.quizIds;if(!ids.length)return practiceHome();let total=ids.length;let finished=Object.keys(state.quizAnswered).length===total;let correct=ids.filter((k,i)=>state.quizAnswered['q'+i]===questions[k][3]).length;return `<div class="eyebrow">QUESTION BANK · ${finished?'YOUR RESULTS':'ACTIVE SESSION'}</div><h1 style="font-family:Georgia,serif;margin:10px 0">${finished?'See what you know.':'Practice without pressure.'}</h1><div class="scoreband"><span>${finished?`You answered <b>${correct} / ${total}</b> correctly`:`<b>${Object.keys(state.quizAnswered).length} / ${total}</b> answered`}</span><span class="chip green">${Math.round(Object.keys(state.quizAnswered).length/total*100)}% complete</span></div>${finished?`<div class="panel" style="padding:24px;background:#f2faf4"><h2>${correct===total?'Perfect work!':correct/total>=.75?'You are getting it.':'Keep learning — you are improving.'}</h2><p class="muted" style="font-size:.86rem">Review every explanation below. You can take another mixed quiz, or return to specific lessons to strengthen weak areas.</p><button class="btn primary" data-action="startQuiz" data-topic="all">Another mixed quiz ↻</button> <button class="btn" data-screen="home">Study lessons</button></div>`:''}
<div>${ids.map((k,i)=>getQuestion(questions[k],'q'+i,true)).join('')}</div><div class="lesson-nav-bottom"><button class="btn" data-screen="practice">← Question bank</button><button class="btn primary" data-action="startQuiz" data-topic="all">New question mix ↻</button></div>`}
const cards=lessons.flatMap(l=>l.terms.map(([front,back])=>({front,back,topic:l.title}))).filter((c,i,a)=>a.findIndex(x=>x.front===c.front)===i);
function flashcardsPage(){let i=(state.flashIndex+cards.length)%cards.length;let c=cards[i];return `<div class="eyebrow">ACTIVE RECALL</div><h1 style="font-family:Georgia,serif;margin:10px 0">One card at a time.</h1><p class="muted">Try to say the meaning out loud, then flip. Learning by recalling is better than only reading.</p><div class="scoreband"><span>Card <b>${i+1} / ${cards.length}</b> · ${c.topic}</span><span class="chip green">${state.flashKnown.size} remembered</span></div><div class="flashcard" id="flashcard" data-action="flipCard" role="button" tabindex="0"><span class="chip" style="justify-self:center;margin-bottom:13px">${state.flashFlip?'ANSWER':'YOUR TURN'}</span><div class="front">${state.flashFlip?escapeHTML(c.back):escapeHTML(c.front)}</div><p style="margin-top:17px">Tap this card to ${state.flashFlip?'see the word again':'reveal the meaning'}.</p></div><div class="demo-controls" style="justify-content:center;margin-top:17px"><button class="btn" data-action="previousCard">← Previous</button><button class="btn ${state.flashKnown.has(c.front)?'selected':''}" data-action="knownCard">${state.flashKnown.has(c.front)?'✓ Remembered':'✓ I knew this'}</button><button class="btn primary" data-action="nextCard">Next card →</button></div><div class="panel" style="padding:23px;margin-top:22px"><h3>All flashcards</h3><p class="muted" style="font-size:.81rem">Click any word to jump to its card.</p><div class="demo-controls">${cards.map((c,i)=>`<button class="btn small ${state.flashKnown.has(c.front)?'selected':''}" data-flash-index="${i}">${escapeHTML(c.front)}</button>`).join('')}</div></div>`}
function examPage(){let selected=[1,5,8,12,16,21,26,31,37,40,45,48,53].filter(x=>x<questions.length);return `<div class="eyebrow">EXAM SIMULATOR</div><h1 style="font-family:Georgia,serif;margin:10px 0">A calm mock exam.</h1><p class="muted">First try the multiple-choice section without seeing answers, then attempt 7 short exam responses. No timer, no pressure. Model mark points help you check your work.</p><div class="note-strip"><span>✎</span><div><b>Exam words:</b> <b>State</b> = give a fact. <b>Describe</b> = give features. <b>Explain</b> = say how or why. <b>Compare</b> = give differences/similarities. More detail usually earns more marks.</div></div><div class="section-head"><div><div class="eyebrow">PART A</div><h2>Multiple choice</h2></div><span class="chip">${selected.length} questions</span></div>${selected.map((q,i)=>getQuestion(questions[q],'e'+i,true)).join('')}
<div class="section-head"><div><div class="eyebrow">PART B</div><h2>Short written answers</h2><p>Write an answer first. Only then click “Show model mark points”.</p></div></div>${shortQuestions.map((a,i)=>`<section class="short-answer" id="s${i}"><div style="display:flex;align-items:start;justify-content:space-between;gap:12px"><h3 style="font-size:1rem;line-height:1.5">${i+1}. ${a[0]}</h3><span class="chip green">${a[2]} marks</span></div><textarea aria-label="Answer to written question ${i+1}" placeholder="Type your answer here before revealing the marking points..."></textarea><div><button class="btn small" data-reveal="${i}">Show model mark points ▾</button></div><div class="rubric"><b>Model marking points:</b> ${a[1]}<p style="font-size:.73rem;margin-top:8px">Suggested practice marking only; this is not an official Cambridge scheme.</p></div></section>`).join('')}<button class="btn primary" onclick="window.print()">Print exam questions & notes</button>`}
const revision=[
['The basics',['Network = devices connected to share resources or communicate.','NIC = network connection hardware; WNIC = wireless version.','A local network does not need internet access.']],
['MAC vs IP',['MAC = 48-bit NIC identifier, shown as six groups of hex digits.','IP = device network location; may change across networks.','IPv4: 32 bits; IPv6: 128 bits.','Switch uses MAC; router uses IP.']],
['Packets',['Messages can be split into smaller packets.','Headers: sender IP, receiver IP, sequence number, size, total packets.','Routers consult routing tables. Receiver reassembles by sequence number.']],
['Hub · Switch · Bridge · Router',['Hub: sends packets to every connected device.','Switch: MAC look-up table → intended device only.','Bridge: connects LAN sections with same protocol.','Router: connects networks; checks IP and routing table.']],
['Wi-Fi vs Bluetooth',['Wi-Fi: WLAN / internet access, typically higher speed and range.','Bluetooth: short-range accessories, 79 channels, frequency hopping.','Wi-Fi book bands: 2.4 GHz and 5 GHz commonly used.']],
['Cloud storage',['Cloud = files saved on remote servers.','Data redundancy = copies across multiple servers.','Public / private / hybrid cloud.','Pros: remote access, backup, sync, collaboration.','Cons: connectivity, security, expense, provider risk.']],
['LAN · WLAN · WAN',['LAN: small local area, such as a school.','WLAN: wireless LAN using access points.','WAN: distant networks, such as a bank ATM network.','Wired: reliable; wireless: mobile but subject to interference.']],
['Exam answer guide',['“State”: write a clear fact.','“Explain”: connect cause and result.','“Compare”: explicitly mention both things.','Use key technical words like MAC, IP, broadcast, routing table.']]
];
function revisionPage(){return `<div class="eyebrow">FINAL RECAP</div><div style="display:flex;align-items:end;justify-content:space-between;gap:12px"><div><h1 style="font-family:Georgia,serif;margin:10px 0">Your one-page memory map.</h1><p class="muted">No extra chapters. Just the definitions, differences, and exam points from pages 76–87.</p></div><button class="btn primary no-print" onclick="window.print()">⎙ Print this</button></div><div class="revision-grid">${revision.map(([title,items],i)=>`<div class="panel revision-card"><span class="chip">${String(i+1).padStart(2,'0')}</span><h3 style="margin-top:12px">${title}</h3><ul class="bullets">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}</div><div class="note-strip">Tip: Cover up the answers and explain each heading out loud. If you can't explain it simply, revisit that lesson.</div>`}
function scopePage(){let outline=[['76','Networks + NIC / WNIC'],['77','MAC addresses, IP, IPv4 and IPv6'],['78','Data packets + hubs'],['79','Switches + switch look-up table'],['80','Switch summary, bridges, routers'],['81','How routers move data across networks'],['82','Router / bridge comparison, Wi-Fi and Bluetooth'],['83','Wireless comparison + cloud basics / types'],['84','Cloud benefits, costs, security and data loss'],['85','LANs and WLANs'],['86','Access points, wired versus wireless'],['87','WANs + beginning of next security section']];return `<div class="eyebrow">YOUR EXACT COVERAGE</div><h1 style="font-family:Georgia,serif;margin:10px 0">The page-by-page map.</h1><p class="muted" style="max-width:770px">Checked against the uploaded <b>Cambridge IGCSE Information and Communication Technology, Third Edition</b> by Graham Brown and David Watson. These numbers are the printed textbook pages (PDF viewer pages 90–101).</p><div class="panel" style="padding:22px;margin:20px 0"><h3 style="margin-bottom:14px">Included in this website</h3>${outline.map(([n,t])=>`<div class="scope-row"><div class="page-circle" style="height:36px;width:40px">${n}</div><div>${t}</div><span class="source-flag">${n==='87'?'WAN only':'IN RANGE'}</span></div>`).join('')}</div><div class="panel" style="padding:24px;background:#fff9f3"><h3 style="margin-bottom:14px">Left out on purpose</h3><ul class="bullets"><li>Detailed passwords, zero-login, biometrics and authentication methods — these continue after page 87.</li><li>Anti-malware, electronic conferencing, VoIP and later network security material — outside this page range.</li><li>Metropolitan area networks (MAN) — explicitly labelled outside the syllabus by the textbook.</li><li>Full lessons on internet / intranet / extranet — referred to later chapters but not explained here.</li></ul></div><div class="note-strip"><span>!</span><div><b>Teacher worksheet not available.</b> An earlier networks study guide is on file, but it is wider than your page range and does not identify which topics your teacher has crossed out. This website deliberately does <b>not</b> treat that guide as proof of your actual exam exclusions. Once you share the teacher worksheet, the content can be filtered more precisely.</div></div>`}
function settingsPage(){return `<div class="eyebrow">MAKE LEARNING COMFORTABLE</div><h1 style="font-family:Georgia,serif;margin:10px 0">Study your way.</h1><p class="muted">Designed for easy reading and low distraction. Your preferences and lesson progress are saved in this browser.</p><div class="panel" style="padding:26px;margin-top:20px;max-width:730px"><div class="setting-row"><div><b>Text size</b><div class="muted" style="font-size:.75rem">Increase all text for comfortable reading.</div></div><input type="range" id="fontRange" min="15" max="21" step="1" value="${state.font}" aria-label="Font size"></div><div class="setting-row"><div><b>Easy reading spacing</b><div class="muted" style="font-size:.75rem">Looser line spacing and letter spacing.</div></div><label class="minitoggle"><input id="easyToggle" type="checkbox" ${state.easy?'checked':''}> On</label></div><div class="setting-row"><div><b>High contrast</b><div class="muted" style="font-size:.75rem">Stronger text and border contrast.</div></div><label class="minitoggle"><input id="contrastToggle" type="checkbox" ${state.contrast?'checked':''}> On</label></div><div class="setting-row"><div><b>Focus mode</b><div class="muted" style="font-size:.75rem">Hide the sidebar while studying.</div></div><label class="minitoggle"><input id="focusToggle" type="checkbox" ${state.focus?'checked':''}> On</label></div></div><div class="panel" style="padding:24px;margin-top:15px;max-width:730px"><h3>Learning progress</h3><p style="font-size:.84rem;color:#688073">${completed()} of ${lessons.length} lessons completed · ${state.flashKnown.size} flashcards remembered.</p>${progressMarkup()}<div class="demo-controls"><button class="btn small" data-screen="home">Go to dashboard</button><button class="btn small" data-action="resetProgress" style="color:#9b665c">Reset learning progress</button></div></div>`}
function searchPage(query){let q=query.toLowerCase().trim();let matches=lessons.map((l,i)=>({l,i,terms:l.terms.filter(t=>t.join(' ').toLowerCase().includes(q))})).filter(({l,terms})=>[l.title,l.subtitle,l.simple,l.analogy,l.points.join(' '),l.trap,l.examQ].join(' ').toLowerCase().includes(q)||terms.length);return `<div class="eyebrow">STUDY SEARCH</div><h1 style="font-family:Georgia,serif;margin:10px 0">Search results</h1><p class="muted">${matches.length} lesson${matches.length===1?'':'s'} match “${escapeHTML(query)}”</p><div class="panel search-results" style="margin-top:20px">${matches.length?matches.map(({l,i,terms})=>`<div class="result" data-lesson="${i}"><b>${escapeHTML(l.title)}</b> <span class="chip" style="float:right">p. ${l.pages}</span><p style="margin:6px 0 0;font-size:.78rem;color:#638074">${escapeHTML(terms.length?terms.slice(0,2).map(x=>x.join(' — ')).join(' · '):l.subtitle)}</p></div>`).join(''):'<div style="padding:24px">No exact matches. Try “router”, “MAC”, “LAN”, or “cloud”.</div>'}</div>`}
function render(){applyPrefs();sidebar();let title={home:'Your dashboard',lesson:lessons[state.lessonIndex].title,practice:'Question bank',quiz:'Practice quiz',flash:'Flashcards',exam:'Mock exam',revision:'Revision sheet',scope:'Scope & pages',settings:'Study settings',search:'Search'};$('#breadcrumb').textContent=title[state.screen]||'Your dashboard';$('#content').innerHTML=({home:homepage,lesson:lessonPage,practice:practiceHome,quiz:quizPage,flash:flashcardsPage,exam:examPage,revision:revisionPage,scope:scopePage,settings:settingsPage,search:()=>searchPage($('#searchBox').value)}[state.screen]||homepage)();if(state.screen==='quiz'){for(let i=0;i<state.quizIds.length;i++){let ans=state.quizAnswered['q'+i];if(ans!==undefined)decorateAnswer('q'+i,ans,questions[state.quizIds[i]])}}}
function decorateAnswer(id,ans,q){let container=document.getElementById(id);if(!container)return;let options=$$('[data-answer]',container);options.forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q[3]);b.classList.toggle('wrong',i===ans&&ans!==q[3])});let feed=$('[data-feedback]',container);feed.innerHTML=`<strong>${ans===q[3]?'✓ Correct!':'Not quite.'}</strong> ${escapeHTML(q[4])}`;}
function handleAnswer(id,chosen){let q;if(id.startsWith('q')){let i=parseInt(id.slice(1),10);q=questions[state.quizIds[i]];if(state.quizAnswered[id]!==undefined)return;state.quizAnswered[id]=chosen;decorateAnswer(id,chosen,q);let counts=Object.keys(state.quizAnswered).length;if(counts===state.quizIds.length){setTimeout(()=>render(),800)}else{let score=$('.scoreband');if(score)score.innerHTML=`<span><b>${counts} / ${state.quizIds.length}</b> answered</span><span class="chip green">${Math.round(counts/state.quizIds.length*100)}% complete</span>`}}else if(id.startsWith('e')){let selected=[1,5,8,12,16,21,26,31,37,40,45,48,53].filter(x=>x<questions.length);q=questions[selected[parseInt(id.slice(1),10)]];if(state.quizAnswered[id]!==undefined)return;state.quizAnswered[id]=chosen;decorateAnswer(id,chosen,q)}}
function handleDemo(v){if(v==='hub'||v==='switch')state.demoMode=v;else if(v==='packets')state.packetStep=(state.packetStep+1)%3;else if(v==='nextRouter')state.routerStep=(state.routerStep+1)%7;else if(v==='wifi'||v==='bluetooth')state.wirelessMode=v;else if(v==='cloud')state.cloudFail=!state.cloudFail;else if(v==='changeIP'){let ip=$('#ip-demo');ip.textContent=ip.textContent==='192.168.1.8'?'10.20.0.8':'192.168.1.8';$('#ip-desc').textContent=ip.textContent==='192.168.1.8'?'At home · can change when you move.':'At café · same NIC, new network IP.';return}let holder=$('.demo-stage');if(holder)holder.outerHTML=diagram(lessons[state.lessonIndex].demo)}
function handleAction(action,el){let l=lessons[state.lessonIndex];if(action==='complete'){if(state.done.has(l.id)){state.done.delete(l.id);toast('Lesson unchecked')}else{state.done.add(l.id);toast('Lesson complete! Well done.')}save();render()}else if(action==='practiceLesson')startQuiz(l.id);else if(action==='startQuiz')startQuiz(el.dataset.topic||'all');else if(action==='flipCard'){state.flashFlip=!state.flashFlip;render()}else if(action==='previousCard'){state.flashIndex=(state.flashIndex+cards.length-1)%cards.length;state.flashFlip=false;render()}else if(action==='nextCard'){state.flashIndex=(state.flashIndex+1)%cards.length;state.flashFlip=false;render()}else if(action==='knownCard'){let k=cards[state.flashIndex].front;if(state.flashKnown.has(k))state.flashKnown.delete(k);else state.flashKnown.add(k);save();render()}else if(action==='resetProgress'){if(window.confirm('Reset completed lessons and remembered flashcards on this device?')){state.done.clear();state.flashKnown.clear();save();render();toast('Progress reset')}}}
window.addEventListener('click',e=>{let target=e.target.closest('[data-screen],[data-lesson],[data-action],[data-topic-tile],[data-demo],[data-check],[data-answer],[data-flash-index],[data-reveal]');if(!target)return;if(target.tagName==='A')e.preventDefault();if(target.hasAttribute('data-screen')){go(target.dataset.screen);return}if(target.hasAttribute('data-lesson')){go('lesson',parseInt(target.dataset.lesson,10));return}if(target.hasAttribute('data-topic-tile')){startQuiz(target.dataset.topicTile);return}if(target.hasAttribute('data-action')){handleAction(target.dataset.action,target);return}if(target.hasAttribute('data-demo')){handleDemo(target.dataset.demo);return}if(target.hasAttribute('data-answer')){let [id,ans]=target.dataset.answer.split('|');handleAnswer(id,parseInt(ans,10));return}if(target.hasAttribute('data-check')){let check=lessons[state.lessonIndex].check;let guess=parseInt(target.dataset.check,10);$$('[data-check]').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===check[2]);b.classList.toggle('wrong',i===guess&&i!==check[2])});$('#checkFeedback').innerHTML=`<p class="feedback"><b>${guess===check[2]?'✓ Exactly right.':'Good attempt.'}</b> ${check[3]}</p>`;return}if(target.hasAttribute('data-flash-index')){state.flashIndex=parseInt(target.dataset.flashIndex,10);state.flashFlip=false;render();return}if(target.hasAttribute('data-reveal')){let el=$('#s'+target.dataset.reveal);el.classList.toggle('open');target.textContent=el.classList.contains('open')?'Hide model mark points ▴':'Show model mark points ▾';return}});
window.addEventListener('change',e=>{if(e.target.id==='easyToggle')state.easy=e.target.checked;if(e.target.id==='contrastToggle')state.contrast=e.target.checked;if(e.target.id==='focusToggle')state.focus=e.target.checked;if(['easyToggle','contrastToggle','focusToggle'].includes(e.target.id)){applyPrefs();render()}});
window.addEventListener('input',e=>{if(e.target.id==='fontRange'){state.font=+e.target.value;applyPrefs()}if(e.target.id==='searchBox'){let q=e.target.value.trim();if(q.length>=2){state.screen='search';render()}else if(state.screen==='search'&&!q){go('home')}}});
window.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.lesson-tile,[data-topic-tile],.flashcard')){e.preventDefault();e.target.click()}if(e.key==='Escape'){$('#sidebar').classList.remove('open');if(document.activeElement?.id==='searchBox')document.activeElement.blur()}});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#focusBtn').addEventListener('click',()=>{state.focus=!state.focus;applyPrefs();render();toast(state.focus?'Focus mode enabled':'Focus mode disabled')});
render();
</script></body></html>
